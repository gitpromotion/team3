spring.application.name=flight-web

# Server
server.port=8080

# Neon PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-holy-mud-azqyx3vb.c-3.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Do not recreate existing Neon tables
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false

# Python Flask Prediction API
ml.api.url=http://localhost:5000
