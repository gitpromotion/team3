spring.application.name=flight-web
server.port=8080

# H2 (파일 DB: ./data/flightdb.mv.db 로 저장됨)
spring.datasource.url=jdbc:h2:file:./data/flightdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔: http://localhost:8080/h2-console  (JDBC URL은 위와 동일하게 입력)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 시작할 때마다 schema.sql → data.sql 실행 (predictions.csv 다시 적재)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.thymeleaf.cache=false

# Python Flask 예측 API 주소
ml.api.url=http://localhost:5000
