<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('대시보드')}"></head>
<body>
<nav th:replace="~{fragments :: nav('dash')}"></nav>
<main>
    <h1>모델 성능 & 지연 현황</h1>
    <div class="sub">
        평가 기간 <span th:text="${range['min_date']}"></span> ~ <span th:text="${range['max_date']}"></span>,
        <span th:text="${#numbers.formatInteger(range['total'], 1, 'COMMA')}"></span>편 (학습에 쓰지 않은 기간) · 시뮬레이션 데이터
    </div>

    <div class="grid g4">
        <div class="card kpi">
            <div class="v" th:text="${#numbers.formatDecimal(metrics['ROC_AUC'], 1, 3)}">0.900</div>
            <div class="l">ROC-AUC · 지연 판별력</div>
        </div>
        <div class="card kpi">
            <div class="v" th:text="${#numbers.formatDecimal(metrics['F1'], 1, 3)}">0.775</div>
            <div class="l">F1 · 정밀도·재현율 균형</div>
        </div>
        <div class="card kpi">
            <div class="v" th:text="${#numbers.formatDecimal(metrics['PRECISION'] * 100, 1, 1)} + '%'">86%</div>
            <div class="l">정밀도 · '지연' 예측 중 실제 지연</div>
        </div>
        <div class="card kpi">
            <div class="v" th:text="${#numbers.formatDecimal(metrics['REG_MAE'], 1, 1)} + '분'">9.4분</div>
            <div class="l">지연 시간 평균 오차</div>
        </div>
    </div>

    <div class="grid g2" style="margin-top:16px">
        <div class="card">
            <h2>항공사별 지연율 — 실제 vs 예측</h2>
            <canvas id="airlineChart" height="230"></canvas>
        </div>
        <div class="card">
            <h2>항공사별 상세</h2>
            <div class="tbl-wrap">
            <table>
                <tr><th>항공사</th><th class="num">편수</th><th class="num">실제 지연율</th><th class="num">예측 지연율</th><th class="num">평균 지연(분)</th></tr>
                <tr th:each="s : ${airlineStats}">
                    <td th:text="${s['airline_name']}"></td>
                    <td class="num" th:text="${#numbers.formatInteger(s['flights'], 1, 'COMMA')}"></td>
                    <td class="num" th:text="${s['actual_rate']} + '%'"></td>
                    <td class="num" th:text="${s['pred_rate']} + '%'"></td>
                    <td class="num" th:text="${s['avg_delay_min']}"></td>
                </tr>
            </table>
            </div>
            <h2 style="margin-top:18px">출발 공항별</h2>
            <div class="tbl-wrap">
            <table>
                <tr><th>공항</th><th class="num">편수</th><th class="num">실제 지연율</th><th class="num">예측 지연율</th></tr>
                <tr th:each="s : ${airportStats}">
                    <td th:text="${s['origin_name']}"></td>
                    <td class="num" th:text="${#numbers.formatInteger(s['flights'], 1, 'COMMA')}"></td>
                    <td class="num" th:text="${s['actual_rate']} + '%'"></td>
                    <td class="num" th:text="${s['pred_rate']} + '%'"></td>
                </tr>
            </table>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:16px">
        <h2>날짜별 지연 위험 Top 20</h2>
        <form class="inline" th:action="@{/}" method="get" style="margin-bottom:12px">
            <div class="field" style="max-width:200px">
                <label>날짜</label>
                <input type="date" name="date" th:value="${day}" th:min="${range['min_date']}" th:max="${range['max_date']}">
            </div>
            <button type="submit">조회</button>
        </form>
        <div class="tbl-wrap">
        <table>
            <tr><th>출발 예정</th><th>편명</th><th>항공사</th><th>구간</th><th class="num">당일 순서</th><th class="num">직전 편 지연</th>
                <th>지연 확률</th><th class="num">예상 지연</th><th>실제 결과</th></tr>
            <tr th:each="r : ${topRisk}">
                <td th:text="${#strings.replace(#strings.substring(r['sched_dep'].toString(), 11, 16), 'T', ' ')}"></td>
                <td><a th:href="@{/search(flightNo=${r['flight_no']}, date=${r['flight_date']})}" th:text="${r['flight_no']}"></a></td>
                <td th:text="${r['airline_name']}"></td>
                <td th:text="${r['origin_name']} + ' → ' + ${r['dest_name']}"></td>
                <td class="num" th:text="${r['leg_seq']} + '번째'"></td>
                <td class="num" th:text="${#numbers.formatInteger(r['prev_arr_delay'], 1)} + '분'"></td>
                <td>
                    <div style="display:flex;align-items:center;gap:8px">
                        <div class="bar"><span th:style="'width:' + ${r['delay_prob'] * 100} + '%'"></span></div>
                        <span th:text="${#numbers.formatDecimal(r['delay_prob'] * 100, 1, 0)} + '%'"></span>
                    </div>
                </td>
                <td class="num" th:text="${#numbers.formatDecimal(r['pred_delay_min'], 1, 0)} + '분'"></td>
                <td>
                    <span th:if="${r['actual_is_delayed'] == 1}" class="badge b-red"
                          th:text="${#numbers.formatInteger(r['actual_dep_delay'], 1)} + '분 지연'"></span>
                    <span th:unless="${r['actual_is_delayed'] == 1}" class="badge b-green">정시</span>
                </td>
            </tr>
        </table>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
    const labels = /*[[${chartLabels}]]*/ [];
    const actual = /*[[${chartActual}]]*/ [];
    const pred = /*[[${chartPred}]]*/ [];
    new Chart(document.getElementById("airlineChart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [
                { label: "실제 지연율(%)", data: actual, backgroundColor: "#d64545" },
                { label: "모델 예측 지연율(%)", data: pred, backgroundColor: "#2f5fd0" }
            ]
        },
        options: { indexAxis: "y", responsive: true, plugins: { legend: { position: "bottom" } },
                   scales: { x: { beginAtZero: true, title: { display: true, text: "%" } } } }
    });
</script>
</body>
</html>
