<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('예측 기록')}"></head>
<body>
<nav th:replace="~{fragments :: nav('history')}"></nav>
<main>
    <h1>예측 기록</h1>
    <div class="sub">'직접 예측'에서 실행한 결과 (H2 prediction_log 테이블, 최근 100건)</div>
    <div class="card">
        <p th:if="${#lists.isEmpty(logs)}" class="hint">아직 기록이 없습니다. <a th:href="@{/predict}">직접 예측</a>을 실행해 보세요.</p>
        <div class="tbl-wrap" th:unless="${#lists.isEmpty(logs)}">
        <table>
            <tr><th>실행 시각</th><th>항공사</th><th>구간</th><th>출발 예정</th><th class="num">당일 순서</th>
                <th class="num">직전 편 지연</th><th class="num">여유</th><th class="num">지연 확률</th><th>판정</th><th class="num">예상 지연</th></tr>
            <tr th:each="l : ${logs}">
                <td th:text="${#strings.substring(l['created_at'].toString(), 0, 16)}"></td>
                <td th:text="${airlines[l['airline_code']]}"></td>
                <td th:text="${airports[l['origin']]} + ' → ' + ${airports[l['dest']]}"></td>
                <td th:text="${#strings.substring(l['sched_dep'].toString(), 0, 16)}"></td>
                <td class="num" th:text="${l['leg_seq']}"></td>
                <td class="num" th:text="${l['prev_arr_delay']}"></td>
                <td class="num" th:text="${l['turn_slack']}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(l['delay_prob'] * 100, 1, 1)} + '%'"></td>
                <td><span th:class="${l['is_delayed']} ? 'badge b-red' : 'badge b-green'"
                          th:text="${l['is_delayed']} ? '지연' : '정시'"></span></td>
                <td class="num" th:text="${#numbers.formatDecimal(l['expected_delay_min'], 1, 0)} + '분'"></td>
            </tr>
        </table>
        </div>
    </div>
</main>
</body>
</html>
