<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('편명 검색')}"></head>
<body>
<nav th:replace="~{fragments :: nav('search')}"></nav>
<main>
    <h1>편명으로 예측 결과 찾기</h1>
    <div class="sub">예: 7C130, KE1157, TW704 · 날짜를 지정하면 같은 기체의 그날 운항 흐름(지연 전파)까지 보여줍니다.</div>

    <div class="card">
        <form class="inline" th:action="@{/search}" method="get">
            <div class="field"><label>편명</label>
                <input type="text" name="flightNo" th:value="${flightNo}" placeholder="7C130" required></div>
            <div class="field"><label>날짜 (선택)</label>
                <input type="date" name="date" th:value="${date}"></div>
            <button type="submit">검색</button>
        </form>
    </div>

    <div class="card" style="margin-top:16px" th:if="${rows != null}">
        <h2 th:text="${flightNo} + ' 검색 결과 ' + ${#lists.size(rows)} + '건'"></h2>
        <p th:if="${#lists.isEmpty(rows)}" class="hint">결과가 없습니다. 평가 기간(2025-08-08 이후)의 편명·날짜인지 확인하세요.</p>
        <div class="tbl-wrap" th:unless="${#lists.isEmpty(rows)}">
        <table>
            <tr><th>날짜</th><th>출발 예정</th><th>구간</th><th>기체</th><th class="num">당일 순서</th>
                <th class="num">지연 확률</th><th>예측</th><th class="num">예상 지연</th><th>실제</th><th>원인</th></tr>
            <tr th:each="r : ${rows}">
                <td><a th:href="@{/search(flightNo=${r['flight_no']}, date=${r['flight_date']})}" th:text="${r['flight_date']}"></a></td>
                <td th:text="${#strings.substring(r['sched_dep'].toString(), 11, 16)}"></td>
                <td th:text="${r['origin_name']} + ' → ' + ${r['dest_name']}"></td>
                <td th:text="${r['tail_no']}"></td>
                <td class="num" th:text="${r['leg_seq']}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(r['delay_prob'] * 100, 1, 1)} + '%'"></td>
                <td><span th:class="${r['pred_delay'] == 1} ? 'badge b-red' : 'badge b-green'"
                          th:text="${r['pred_delay'] == 1} ? '지연 예상' : '정시 예상'"></span></td>
                <td class="num" th:text="${#numbers.formatDecimal(r['pred_delay_min'], 1, 0)} + '분'"></td>
                <td th:text="${#numbers.formatInteger(r['actual_dep_delay'], 1)} + '분'"></td>
                <td th:text="${r['delay_cause']}"></td>
            </tr>
        </table>
        </div>
    </div>

    <div class="card" style="margin-top:16px" th:if="${tailDay != null}">
        <h2 th:text="'기체 ' + ${selected['tail_no']} + ' 의 ' + ${selected['flight_date']} + ' 운항 흐름'"></h2>
        <p class="hint">앞 편이 늦게 도착하면 같은 기체의 다음 편도 늦어지는 '연결편 지연'을 확인할 수 있어요. 노란 줄이 검색한 편입니다.</p>
        <div class="tbl-wrap">
        <table>
            <tr><th class="num">순서</th><th>편명</th><th>구간</th><th>출발 예정</th><th class="num">직전 편 지연</th>
                <th class="num">지연 확률</th><th class="num">실제 출발 지연</th><th>원인</th></tr>
            <tr th:each="t : ${tailDay}" th:classappend="${t['flight_id'] == selected['flight_id']} ? 'hl'">
                <td class="num" th:text="${t['leg_seq']}"></td>
                <td th:text="${t['flight_no']}"></td>
                <td th:text="${t['origin_name']} + ' → ' + ${t['dest_name']}"></td>
                <td th:text="${#strings.substring(t['sched_dep'].toString(), 11, 16)}"></td>
                <td class="num" th:text="${#numbers.formatInteger(t['prev_arr_delay'], 1)} + '분'"></td>
                <td class="num" th:text="${#numbers.formatDecimal(t['delay_prob'] * 100, 1, 1)} + '%'"></td>
                <td class="num" th:text="${#numbers.formatInteger(t['actual_dep_delay'], 1)} + '분'"></td>
                <td th:text="${t['delay_cause']}"></td>
            </tr>
        </table>
        </div>
    </div>
</main>
</body>
</html>
