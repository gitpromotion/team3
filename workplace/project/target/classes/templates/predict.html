<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('직접 예측')}"></head>
<body>
<nav th:replace="~{fragments :: nav('predict')}"></nav>
<main>
    <h1>지연 직접 예측</h1>
    <div class="sub">조건을 입력하면 Python 모델 API가 지연 확률과 예상 지연 시간을 계산합니다. 결과는 H2의 prediction_log 테이블에 저장돼요.</div>

    <div class="alert alert-warn" th:if="${!apiOnline}">
        예측 API(Python)가 꺼져 있습니다. 터미널에서 <b>ml_api</b> 폴더로 이동해 <code>python3 app.py</code> 를 먼저 실행하세요.
    </div>
    <div class="alert alert-err" th:if="${error != null}" th:text="${error}"></div>

    <div class="grid g2">
        <div class="card">
            <form th:action="@{/predict}" method="post">
                <div class="form-grid">
                    <div><label>항공사</label>
                        <select name="airlineCode">
                            <option th:each="a : ${airlines}" th:value="${a.key}" th:text="${a.value}"
                                    th:selected="${input != null and input['airline_code'] == a.key}"></option>
                        </select></div>
                    <div><label>출발</label>
                        <select name="origin">
                            <option th:each="a : ${airports}" th:value="${a.key}" th:text="${a.value}"
                                    th:selected="${input != null ? input['origin'] == a.key : a.key == 'GMP'}"></option>
                        </select></div>
                    <div><label>도착</label>
                        <select name="dest">
                            <option th:each="a : ${airports}" th:value="${a.key}" th:text="${a.value}"
                                    th:selected="${input != null ? input['dest'] == a.key : a.key == 'CJU'}"></option>
                        </select></div>
                    <div><label>출발 예정 일시</label>
                        <input type="datetime-local" name="schedDep" required
                               th:value="${input != null ? input['sched_dep'] : '2025-12-24T18:30'}"></div>
                    <div><label>이 기체의 오늘 몇 번째 운항</label>
                        <input type="number" name="legSeq" min="1" max="12"
                               th:value="${input != null ? input['leg_seq'] : 1}">
                        <div class="hint">1이면 첫 편 (직전 편 정보 무시)</div></div>
                    <div><label>직전 편 도착 지연(분)</label>
                        <input type="number" name="prevArrDelay" step="1"
                               th:value="${input != null ? input['prev_arr_delay'] : 0}"></div>
                    <div><label>회항 여유시간(분)</label>
                        <input type="number" name="turnSlack" step="5" placeholder="모르면 비워두기 (40분)"
                               th:value="${input != null ? input['turn_slack'] : ''}">
                        <div class="hint">직전 편 예정 도착 ~ 이번 편 예정 출발</div></div>
                </div>
                <fieldset>
                    <legend>출발지 기상 직접 지정 (비우면 기상 테이블 값 사용)</legend>
                    <div class="form-grid">
                        <div><label>돌풍(kt)</label><input type="number" name="gustKt" step="1" placeholder="예: 35"></div>
                        <div><label>시정(m)</label><input type="number" name="visibilityM" step="100" placeholder="예: 800"></div>
                        <div><label>기상</label>
                            <select name="wxCode">
                                <option value="">자동</option><option value="CLR">맑음</option><option value="RA">비</option>
                                <option value="SN">눈</option><option value="FG">안개</option><option value="TS">뇌우</option>
                                <option value="TY">태풍</option>
                            </select></div>
                    </div>
                </fieldset>
                <div style="margin-top:16px"><button type="submit">예측하기</button></div>
            </form>
        </div>

        <div class="card" th:if="${result != null}">
            <h2 th:text="${airlineName} + ' ' + ${originName} + ' → ' + ${destName}"></h2>
            <div class="hint" th:text="'출발 예정 ' + ${#strings.replace(input['sched_dep'], 'T', ' ')} + ' · 도착 예정 ' + ${result['sched_arr']}"></div>
            <div style="margin:18px 0">
                <div class="result-big" th:style="${result['is_delayed']} ? 'color:#d64545' : 'color:#2e9b5f'"
                     th:text="${probPct} + '%'"></div>
                <div>지연 확률 ·
                    <span th:class="${result['is_delayed']} ? 'badge b-red' : 'badge b-green'"
                          th:text="${result['is_delayed']} ? '지연 예상' : '정시 예상'"></span>
                    <span class="hint" th:text="'(기준 ' + ${#numbers.formatDecimal(result['threshold'] * 100, 1, 0)} + '% 이상이면 지연)'"></span>
                </div>
            </div>
            <p>지연된다면 약 <b th:text="${#numbers.formatDecimal(result['expected_delay_min'], 1, 0)} + '분'"></b> 늦어질 것으로 예상</p>
            <table>
                <tr><th></th><th>기상</th><th class="num">돌풍(kt)</th><th class="num">시정(m)</th><th class="num">강수(mm)</th></tr>
                <tr><td>출발지</td><td th:text="${result['weather_used']['origin']['wx_code']}"></td>
                    <td class="num" th:text="${result['weather_used']['origin']['gust_kt']}"></td>
                    <td class="num" th:text="${#numbers.formatInteger(result['weather_used']['origin']['visibility_m'], 1)}"></td>
                    <td class="num" th:text="${result['weather_used']['origin']['precip_mm']}"></td></tr>
                <tr><td>도착지</td><td th:text="${result['weather_used']['dest']['wx_code']}"></td>
                    <td class="num" th:text="${result['weather_used']['dest']['gust_kt']}"></td>
                    <td class="num" th:text="${#numbers.formatInteger(result['weather_used']['dest']['visibility_m'], 1)}"></td>
                    <td class="num" th:text="${result['weather_used']['dest']['precip_mm']}"></td></tr>
            </table>
            <p class="hint" th:if="${result['prev_delay_minus_slack'] > 0}"
               th:text="'직전 편 지연이 회항 여유보다 ' + ${#numbers.formatDecimal(result['prev_delay_minus_slack'], 1, 0)} + '분 커서 지연이 그대로 넘어올 가능성이 높아요.'"></p>
        </div>
    </div>
</main>
</body>
</html>
